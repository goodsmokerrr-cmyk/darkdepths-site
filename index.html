<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Depths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow reading column, two languages stacked, set like a page from the game's own rulebook */
:root {
  --stone: #f3eee6; --ink: #241e19; --muted: #6b5f53; --bronze: #8a5a22; --rule: #d8ccbb; --panel: #ebe3d6;
  --display: 'Forum', Georgia, 'Times New Roman', serif;
  --body: 'Alegreya', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stone: #15120f; --ink: #e9dfcf; --muted: #a8998a; --bronze: #d6a25a; --rule: #3a3129; --panel: #1f1a16; color-scheme: dark } }
:root[data-theme="dark"] { --stone: #15120f; --ink: #e9dfcf; --muted: #a8998a; --bronze: #d6a25a; --rule: #3a3129; --panel: #1f1a16; color-scheme: dark }
body { background: var(--stone); color: var(--ink); font: 400 18px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--rule); padding-bottom: 20px; }
.eyebrow { font: 700 13px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); }
h1 { font: 400 clamp(32px, 7vw, 44px)/1.1 var(--display); margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 15px; margin: 0; }
nav { display: flex; gap: 16px; font-size: 15px; }
a { color: var(--bronze); }
a:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { font: 400 26px/1.2 var(--display); margin: 8px 0 0; color: var(--ink); }
h3 { font: 700 17px/1.3 var(--body); margin: 10px 0 0; color: var(--bronze); }
p, ul { margin: 0; }
ul { padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.summary { background: var(--panel); border-left: 3px solid var(--bronze); padding: 14px 16px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 12px 0; width: 100%; }
</style>
</head><body>
<main><header><span class="eyebrow">Dark Depths: Dungeon RPG</span><h1>Dark Depths</h1>
<p class="meta">A dark fantasy dungeon RPG for iPhone. · Мрачная ролевая игра о спуске в подземелья для iPhone.</p></header>
<section><p><a href="support.html">Support · Поддержка</a></p><p><a href="privacy.html">Privacy Policy · Политика конфиденциальности</a></p></section></main>
</body></html>
